</style></head>
<body>
<svg id="stage" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="ctl"><button id="play">▶ Play</button></div>
<audio id="aud" src="narration.mp3" preload="auto"></audio>
<script src="words.js"></script>
<script>
const W = WORDS.words, S = document.getElementById('stage');
if (location.hash === '#rec') document.body.classList.add('rec');
// Neutral palette (navy + teal, matching the talk slide). Tier colours: public, internal, sensitive.
const C = {bg:'#0f1a2e', ink:'#eef2fa', dim:'#9aa8c0', or:'#2fb8b4', bl:'#7fa8e6', gr:'#3fb27f', red:'#e46a6a', warn:'#e0a940',
           box:'#18263f', line:'#33456a', navy:'#1c2b4a', paper:'#ffffff', soft:'#f5f7fb', ptext:'#172033', pmuted:'#536071', pborder:'#d9dee8', ok:'#1f7a4d', bad:'#a23333'};
const TIER = [C.gr, C.warn, C.red];
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
function at(phrase, after=0){
  const p = phrase.split(/\s+/).map(norm);
  for (let i=0;i<W.length;i++){
    if (W[i].start < after) continue;
    let ok = true;
    for (let j=0;j<p.length;j++){ if (!W[i+j] || norm(W[i+j].text)!==p[j]) {ok=false;break;} }
    if (ok) return W[i].start;
  }
  console.error('phrase not found: '+phrase); return 1e9;
}
const END = W[W.length-1].end + 1.5;
const T = {
  intro: 0,
  why: at('Start with why agents'),
  tiers: at('A simple way to'),
  know: at('The first step is'),
  decide: at('The second step is'),
  safe: at('The third step is'),
  example: at('Here is how that'),
  rules: at('Your obligations also depend'),
  outro: at('So the principle is'),
};
const cue = {
  price: at('A public price list'), sales: at('a monthly sales table'), patient: at('and a patient record'), match: at('This video looks'),
  connect: at('When you connect'), reads: at('It reads quickly'), ends: at('and what it reads'), coding: at('A coding agent building'), onlysafe: at('is only as safe'),
  pub: at('At one end'), internal: at('In the middle'), sensitive: at('At the far end'), rises: at('As you move along'), safeg: at('and so should the'),
  cols: at('Which tables and'), combo: at('Remember that fields'), dob: at('A date of birth'), labels: at('Sensitivity labels help'), flow: at('In Fabric and Power'), travels: at('so the classification travels'),
  q3: at('which agents can access'), purpose: at('Purpose matters as much'), counts: at('Counts of clinic visits'), list: at('a list of individual'), same: at('even when both'),
  four: at('There are four common'), asis: at('Some data is suitable'), pubgo: at('Public reference data can'),
  mask: at('Some data needs masking'), view: at('Give the agent a'), caution: at('One caution here'), ddm: at('Dynamic data masking hides'), infer: at('Someone with query access'), many: at('and an agent can'), pair: at('So pair masking'),
  synth: at('Some work belongs'), copy: at('The synthetic copy has'), build: at('The agent can build'), promote: at('Then you promote'),
  off: at('And some data stays'), restricted: at('Restricted permissions mean'),
  analyst: at('An analyst wants'), dev: at('The agent develops'), test: at('Testing uses a'), prod: at('The production model refreshes'), never: at('and the agent itself'), later: at('Later a data agent'), nopatient: at('with no patient level'),
  nz: at('In New Zealand for'), know2: at('Know which rules apply'),
  o1: at('Know what you hold'), o2: at('Decide which agents get'), o3: at('And match agent access'),
};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const fin=(t,t0,d=.5)=>ease((t-t0)/d);
const win2=(t,a,b)=>fin(t,a)*(1-fin(t,b,.4));   // visible from a until b
let out='';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function txt(x,y,s,{size=28,fill=C.ink,anchor='start',weight=400,op=1,italic=false,mono=false}={}){ if(op<=0)return; out+=`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}" opacity="${op}"${italic?' font-style="italic"':''}${mono?' font-family="Consolas, monospace"':''}>${esc(s)}</text>`; }
function rect(x,y,w,h,{fill=C.box,stroke=C.line,sw=2,r=10,op=1,dash=''}={}){ if(op<=0)return; out+=`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:''}/>`; }
function circ(x,y,r,{fill=C.box,stroke=C.line,sw=2,op=1}={}){ if(op<=0)return; out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`; }
function line(x1,y1,x2,y2,{stroke=C.dim,sw=2,op=1,dash=''}={}){ if(op<=0)return; out+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:''}/>`; }
function path(d,{stroke=C.dim,sw=2,op=1,dash='',fill='none'}={}){ if(op<=0)return; out+=`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:''}/>`; }
function arrow(x1,y1,x2,y2,o={}){ line(x1,y1,x2,y2,o); const a=Math.atan2(y2-y1,x2-x1),L=12; const op=o.op??1; if(op<=0)return;
  out+=`<polygon points="${x2},${y2} ${x2-L*Math.cos(a-.4)},${y2-L*Math.sin(a-.4)} ${x2-L*Math.cos(a+.4)},${y2-L*Math.sin(a+.4)}" fill="${o.stroke||C.dim}" opacity="${op}"/>`; }
function tick(x,y,s,col,op,sw=3){ path(`M${x-s*.5},${y} L${x-s*.12},${y+s*.38} L${x+s*.55},${y-s*.4}`,{stroke:col,sw,op}); }
function cross(x,y,s,col,op,sw=3){ line(x-s/2,y-s/2,x+s/2,y+s/2,{stroke:col,sw,op}); line(x+s/2,y-s/2,x-s/2,y+s/2,{stroke:col,sw,op}); }
function title(t,t0,s,sub){ const o=fin(t,t0); txt(64,74,s,{size:36,weight:700,op:o}); line(64,92,64+s.length*17,92,{stroke:C.or,sw:4,op:o}); if(sub) txt(64,124,sub,{size:20,fill:C.dim,op:o}); }
function pill(x,y,w,label,col,op,size=20,h=44){ rect(x,y,w,h,{fill:col+'22',stroke:col,op,r:h/2}); txt(x+w/2,y+h/2+size*.36,label,{size,anchor:'middle',op}); }
function wrap(s,n){ const ls=[]; let l=''; for(const w of s.split(' ')){ if((l+' '+w).length>n&&l){ls.push(l);l=w;} else l=l?l+' '+w:w; } ls.push(l); return ls; }

// --- icons (centred at x,y; s = nominal size) ---
function icon(kind,x,y,s,col,op){ if(op<=0) return; const k=s/60;
  if(kind==='doc'){ path(`M${x-20*k},${y-27*k} L${x+10*k},${y-27*k} L${x+21*k},${y-16*k} L${x+21*k},${y+27*k} L${x-20*k},${y+27*k} Z`,{stroke:col,sw:3,op,fill:col+'22'}); [-10,0,10].forEach(d=>line(x-11*k,y+d*k,x+12*k,y+d*k,{stroke:col,op,sw:2.5})); }
  if(kind==='globe'){ circ(x,y,25*k,{fill:col+'22',stroke:col,sw:3,op}); out+=`<ellipse cx="${x}" cy="${y}" rx="${11*k}" ry="${25*k}" fill="none" stroke="${col}" stroke-width="2.5" opacity="${op}"/>`; line(x-25*k,y,x+25*k,y,{stroke:col,sw:2.5,op}); line(x-21*k,y-12*k,x+21*k,y-12*k,{stroke:col,sw:2,op}); line(x-21*k,y+12*k,x+21*k,y+12*k,{stroke:col,sw:2,op}); }
  if(kind==='folder'){ path(`M${x-27*k},${y-18*k} L${x-8*k},${y-18*k} L${x-3*k},${y-11*k} L${x+27*k},${y-11*k} L${x+27*k},${y+22*k} L${x-27*k},${y+22*k} Z`,{stroke:col,sw:3,op,fill:col+'22'}); [3,13].forEach(d=>line(x-15*k,y+d*k,x+15*k,y+d*k,{stroke:col,sw:2.5,op})); }
  if(kind==='patient'){ rect(x-22*k,y-27*k,44*k,54*k,{fill:col+'22',stroke:col,sw:3,op,r:5}); circ(x,y-11*k,7*k,{fill:'none',stroke:col,sw:2.5,op}); path(`M${x-12*k},${y+6*k} Q${x},${y-6*k} ${x+12*k},${y+6*k}`,{stroke:col,sw:2.5,op}); line(x-12*k,y+15*k,x+12*k,y+15*k,{stroke:col,sw:2.5,op}); lock(x+20*k,y+20*k,s*.45,col,op); }
  if(kind==='db'){ const rx=22*k, ry=8*k; out+=`<path d="M${x-rx},${y-18*k} L${x-rx},${y+18*k} A${rx},${ry} 0 0 0 ${x+rx},${y+18*k} L${x+rx},${y-18*k}" fill="${col}22" stroke="${col}" stroke-width="3" opacity="${op}"/>`;
    out+=`<ellipse cx="${x}" cy="${y-18*k}" rx="${rx}" ry="${ry}" fill="${C.bg}" stroke="${col}" stroke-width="3" opacity="${op}"/>`; path(`M${x-rx},${y} A${rx},${ry} 0 0 0 ${x+rx},${y}`,{stroke:col,sw:2.5,op}); }
  if(kind==='agent'){ line(x,y-30*k,x,y-21*k,{stroke:col,sw:3,op}); circ(x,y-32*k,4*k,{fill:col,stroke:'none',sw:0,op}); rect(x-24*k,y-21*k,48*k,40*k,{fill:col+'22',stroke:col,sw:3,op,r:10*k});
    circ(x-9*k,y-3*k,4.5*k,{fill:col,stroke:'none',sw:0,op}); circ(x+9*k,y-3*k,4.5*k,{fill:col,stroke:'none',sw:0,op}); line(x-8*k,y+9*k,x+8*k,y+9*k,{stroke:col,sw:3,op}); line(x-24*k,y-1*k,x-30*k,y-1*k,{stroke:col,sw:3,op}); line(x+24*k,y-1*k,x+30*k,y-1*k,{stroke:col,sw:3,op}); }
  if(kind==='chat'){ path(`M${x-26*k},${y-20*k} L${x+26*k},${y-20*k} L${x+26*k},${y+12*k} L${x-4*k},${y+12*k} L${x-14*k},${y+24*k} L${x-14*k},${y+12*k} L${x-26*k},${y+12*k} Z`,{stroke:col,sw:3,op,fill:col+'22'}); [-9,1].forEach(d=>line(x-16*k,y+d*k,x+16*k,y+d*k,{stroke:col,sw:2.5,op})); }
  if(kind==='log'){ rect(x-24*k,y-24*k,48*k,48*k,{fill:col+'22',stroke:col,sw:3,op,r:5}); [-12,-3,6,15].forEach((d,i)=>{ circ(x-14*k,y+d*k,2*k,{fill:col,stroke:'none',sw:0,op}); line(x-8*k,y+d*k,x+(14-i%2*7)*k,y+d*k,{stroke:col,sw:2.5,op}); }); }
  if(kind==='prompt'){ rect(x-27*k,y-20*k,54*k,40*k,{fill:col+'22',stroke:col,sw:3,op,r:6}); path(`M${x-16*k},${y-7*k} L${x-7*k},${y} L${x-16*k},${y+7*k}`,{stroke:col,sw:3,op}); line(x-2*k,y+8*k,x+14*k,y+8*k,{stroke:col,sw:3,op}); }
  if(kind==='key'){ circ(x-12*k,y,10*k,{fill:col+'22',stroke:col,sw:3,op}); line(x-2*k,y,x+24*k,y,{stroke:col,sw:3,op}); line(x+16*k,y,x+16*k,y+9*k,{stroke:col,sw:3,op}); line(x+23*k,y,x+23*k,y+7*k,{stroke:col,sw:3,op}); }
  if(kind==='people'){ [-14,14].forEach(d=>{ circ(x+d*k,y-10*k,8*k,{fill:col+'33',stroke:col,sw:2.5,op}); path(`M${x+(d-15)*k},${y+20*k} Q${x+d*k},${y-6*k} ${x+(d+15)*k},${y+20*k} Z`,{stroke:col,fill:col+'33',op,sw:2.5}); }); }
  if(kind==='chart'){ line(x-24*k,y+22*k,x+24*k,y+22*k,{stroke:col,sw:3,op}); [[-16,14],[-4,26],[8,38],[20,20]].forEach(([dx,h])=>rect(x+dx*k-4*k,y+22*k-h*k,8*k,h*k,{fill:col,stroke:'none',sw:0,op,r:1})); }
}
function lock(x,y,s,col,op,open=0){ if(op<=0) return; const k=s/60; rect(x-16*k,y-6*k,32*k,26*k,{fill:col,stroke:'none',sw:0,op,r:4*k});
  path(`M${x-10*k},${y-6*k} L${x-10*k},${y-(14+open*8)*k} A${10*k},${10*k} 0 0 1 ${x+10*k},${y-(14+open*8)*k} L${x+10*k},${y-(10+open*8)*k}`,{stroke:col,sw:Math.max(2,4*k),op}); circ(x,y+5*k,3.5*k,{fill:C.bg,stroke:'none',sw:0,op}); }
function ban(x,y,r,col,op){ circ(x,y,r,{fill:'none',stroke:col,sw:Math.max(3,r/6),op}); line(x-r*.7,y-r*.7,x+r*.7,y+r*.7,{stroke:col,sw:Math.max(3,r/6),op}); }
const TIERS=[['Public information','globe','published reports, reference data'],['Internal business data','folder','sales, finance, operations'],['Sensitive personal data','patient','e.g. identifiable health data']];
// sensitivity arrow (gradient)
function sensArrow(x1,x2,y,op,label=true){ if(op<=0)return;
  out+=`<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="${C.gr}" stop-opacity=".15"/><stop offset=".5" stop-color="${C.warn}" stop-opacity=".7"/><stop offset="1" stop-color="${C.red}"/></linearGradient></defs>`;
  out+=`<rect x="${x1}" y="${y-7}" width="${x2-x1-20}" height="14" rx="7" fill="url(#sg)" opacity="${op}"/>`;
  out+=`<polygon points="${x2},${y} ${x2-28},${y-18} ${x2-28},${y+18}" fill="${C.red}" opacity="${op}"/>`;
  if(label) txt((x1+x2)/2,y+40,'Increasing sensitivity',{size:20,anchor:'middle',fill:C.dim,weight:700,op}); }

const scenes = [
 ['intro', t=>{
   const o=fin(t,.1,.8);
   txt(640,170,'AI AGENTS · DATA · GOVERNANCE',{size:20,anchor:'middle',fill:C.or,weight:700,op:o});
   txt(640,240,'Data risk tiers',{size:58,anchor:'middle',weight:700,op:fin(t,.4,.8)});
   txt(640,290,'matching AI agent access to the risk of the data',{size:26,anchor:'middle',fill:C.dim,op:fin(t,.9,.8)});
   const cs=[cue.price,cue.sales,cue.patient], lbl=['Public price list','Monthly sales table','Patient record'], ic=['doc','chart','patient'];
   cs.forEach((c,i)=>{ const oo=fin(t,c); const x=340+i*300; circ(x,410,56,{fill:C.box,stroke:TIER[i],op:oo,sw:3}); icon(ic[i],x,412,62,TIER[i],oo); txt(x,500,lbl[i],{size:22,anchor:'middle',weight:600,op:oo}); });
   sensArrow(240,1050,555,fin(t,cue.match),false);
   txt(640,600,'Different data, different handling',{size:22,anchor:'middle',fill:C.dim,op:fin(t,cue.match)});
 }],
 ['why', t=>{
   title(t,T.why,'Why agents change the picture');
   const oc=fin(t,cue.connect);
   // source -> agent
   rect(70,230,220,190,{fill:C.box,stroke:C.line,op:oc,r:14}); icon('db',180,300,80,C.bl,oc); txt(180,380,'Data source',{size:20,anchor:'middle',weight:700,op:oc});
   const ag=fin(t,cue.connect+1.2);
   line(300,325,470,325,{stroke:C.or,sw:4,op:ag}); txt(385,312,'connection',{size:16,anchor:'middle',fill:C.dim,op:ag});
   circ(560,325,82,{fill:C.or+'1c',stroke:C.or,op:ag,sw:3}); icon('agent',560,333,92,C.or,ag); txt(560,445,'AI agent',{size:22,anchor:'middle',weight:700,op:ag});
   txt(385,370,'reads whatever',{size:16,anchor:'middle',fill:C.dim,op:fin(t,cue.connect+2.4)}); txt(385,392,'it allows',{size:16,anchor:'middle',fill:C.dim,op:fin(t,cue.connect+2.4)});
   // query pulses
   const orr=fin(t,cue.reads);
   if(orr>0) for(let i=0;i<5;i++){ const ph=((t-cue.reads)*1.4+i/5)%1; circ(300+ph*170,325,5,{fill:C.or,stroke:'none',sw:0,op:orr*(1-fin(t,cue.coding))}); }
   txt(560,480,'fast · many queries in a row',{size:17,anchor:'middle',fill:C.or,op:orr});
   // where it ends up
   const dests=[['prompt','A prompt'],['log','A log'],['chat','A chat history'],['doc','A generated file']];
   dests.forEach(([ic,s],i)=>{ const oo=fin(t,cue.ends+.5+i*.55); const y=150+i*84; arrow(648,325,820,y+32,{stroke:C.line,op:oo,sw:2.5});
     rect(830,y,300,64,{fill:C.box,stroke:C.line,op:oo,r:12}); icon(ic,875,y+32,42,C.bl,oo); txt(915,y+40,s,{size:21,op:oo}); });
   const ok=fin(t,cue.coding);
   rect(70,520,1060,64,{fill:C.or+'16',stroke:C.or,op:ok,r:12});
   txt(100,560,'Coding agent → notebook',{size:20,weight:700,op:ok}); txt(420,560,'·',{size:20,op:ok}); txt(445,560,'Data agent → semantic model',{size:20,weight:700,op:ok});
   txt(1105,560,'only as safe as the data it can reach',{size:19,anchor:'end',fill:C.or,weight:700,op:fin(t,cue.onlysafe)});
 }],
 ['tiers', t=>{
   title(t,T.tiers,'Three tiers of data');
   const cs=[cue.pub,cue.internal,cue.sensitive];
   TIERS.forEach(([a,ic,b],i)=>{ const oo=fin(t,cs[i]); const x=240+i*400; const lit=t>=cs[i]&&(i==2||t<cs[i+1]);
     rect(x-170,160,340,250,{fill:lit?TIER[i]+'1a':C.box,stroke:TIER[i],op:oo,r:16,sw:lit?3:2});
     icon(ic,x,245,100,TIER[i],oo); txt(x,345,a,{size:24,anchor:'middle',weight:700,op:oo}); txt(x,378,b,{size:18,anchor:'middle',fill:C.dim,op:oo}); });
   sensArrow(90,1200,450,fin(t,cue.rises));
   const os=fin(t,cue.safeg);
   txt(90,545,'Safeguards should rise too',{size:20,weight:700,fill:C.or,op:os});
   [0,1,2].forEach(i=>{ const h=30+i*30; rect(240+i*400-70,600-h,140,h,{fill:TIER[i]+'88',stroke:TIER[i],op:os*fin(t,cue.safeg+.2+i*.25,.3),r:6}); });
 }],
 ['know', t=>{
   title(t,T.know,'Step 1: understand what you hold');
   // table
   const o=fin(t,cue.cols);
   rect(64,150,600,300,{fill:C.paper,stroke:C.pborder,op:o,r:10,sw:1}); rect(64,150,600,46,{fill:C.navy,stroke:'none',sw:0,op:o,r:10}); rect(64,180,600,16,{fill:C.navy,stroke:'none',sw:0,op:o,r:0});
   icon('db',92,173,30,C.or,o); txt(116,180,'clinic_visits',{size:19,weight:700,op:o,mono:true});
   const cols=[['visit_id',0],['full_name',1],['email',1],['date_of_birth',1],['postcode',2],['gender',2],['patient_id',1],['diagnosis',1]];
   cols.forEach(([c,s],i)=>{ const cx=88+(i%2)*290, cy=212+Math.floor(i/2)*58; const flag=s===1?fin(t,cue.cols+1+i*.35):0; const q=s===2?fin(t,cue.dob):0;
     const isDob=c==='date_of_birth'; const combo=fin(t,cue.dob)*(isDob||s===2?1:0);
     const col=combo>0?C.warn:flag>0?C.red:C.pborder;
     rect(cx,cy,268,44,{fill:combo>0?'#fdf3e1':flag>0?'#fdecec':C.soft,stroke:col,op:o,r:6,sw:flag||combo?2:1});
     txt(cx+16,cy+29,c,{size:18,fill:C.ptext,op:o,mono:true});
     if(flag>0&&!combo) txt(cx+252,cy+29,'personal',{size:14,anchor:'end',fill:C.bad,weight:700,op:flag});
   });
   // combination
   const oc=fin(t,cue.combo);
   txt(720,180,'IDENTIFYING IN COMBINATION',{size:17,fill:C.warn,weight:700,op:oc});
   const parts=['Date of birth','Postcode','Gender']; parts.forEach((p,i)=>{ const oo=fin(t,cue.dob+.3+i*.5); pill(720+i*170,200,155,p,C.warn,oo,17,40); if(i<2) txt(720+i*170+162,227,'+',{size:22,anchor:'middle',fill:C.warn,weight:700,op:oo}); });
   const op1=fin(t,cue.dob+2.2); arrow(970,250,970,292,{stroke:C.warn,op:op1,sw:3}); icon('people',940,320,0,C.warn,0);
   rect(860,298,220,50,{fill:C.warn+'22',stroke:C.warn,op:op1,r:25}); txt(970,330,'often one person',{size:19,anchor:'middle',weight:700,op:op1});
   // label flow
   const ol=fin(t,cue.labels); txt(64,500,'SENSITIVITY LABELS',{size:17,fill:C.or,weight:700,op:ol});

const SENTS=[]; { let cur=null; for(const w of W){ if(!cur){cur={start:w.start,text:[]};} cur.text.push(w.text); cur.end=w.end; if(/[.?!]$/.test(w.text)){SENTS.push(cur);cur=null;} } if(cur)SENTS.push(cur); }
function subtitle(t){ const s=SENTS.find(s=>t>=s.start-.05 && t<=s.end+.3); if(!s) return;
  const lines=wrap(s.text.join(' '),98);
  const h=lines.length*30+18; rect(140,714-h-4,1000,h,{fill:'#000000',stroke:'none',sw:0,r:8,op:.7});
  lines.forEach((ln,i)=>txt(640,714-h-4+32+i*30,ln,{size:20.5,anchor:'middle'})); }

window.render = function(t){
  out=`<rect width="1280" height="720" fill="${C.bg}"/>`;
  const keys=scenes.map(s=>T[s[0]]);
  let idx=0; for(let i=0;i<scenes.length;i++) if(t>=keys[i]) idx=i;
  const next = idx+1<scenes.length ? keys[idx+1] : END;
  const fadeOut = clamp((next - t)/0.4);
  out+=`<g opacity="${idx+1<scenes.length?fadeOut:1}">`; scenes[idx][1](t); out+='</g>';
  rect(0,0,1280*clamp(t/END),4,{fill:C.or,stroke:'none',sw:0,r:0});
  subtitle(t);
  S.innerHTML=out;
};
render(0);
