<script>
const W = WORDS.words, S = document.getElementById('stage');
if (location.hash === '#rec') document.body.classList.add('rec');
const C = {bg:'#0f1a2e', ink:'#eef2fa', dim:'#9aa8c0', or:'#2fb8b4', bl:'#7fa8e6', gr:'#3fb27f', red:'#e46a6a', warn:'#e0a940',
           box:'#18263f', line:'#33456a', navy:'#1c2b4a', paper:'#ffffff', soft:'#f5f7fb', ptext:'#172033', pmuted:'#536071', pborder:'#d9dee8', ok:'#1f7a4d', bad:'#a23333'};
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,'');
function at(phrase, after=0){
  const p = phrase.split(/\s+/).map(norm);
  for (let i=0;i<W.length;i++){
    if (W[i].start < after) continue;
    let ok = true;
    for (let j=0;j<p.length;j++){ if (!W[i+j] || norm(W[i+j].text)!==p[j]) {ok=false;break;} }
    if (ok) return W[i].start;
  }
  console.error('phrase not found: '+phrase); return 1e9;
}
const END = W[W.length-1].end + 1.5;

  intro: 0,

function rect(x,y,w,h,{fill=C.box,stroke=C.line,sw=2,r=10,op=1,dash=''}={}){ if(op<=0)return; out+=`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:''}/>`; }
function circ(x,y,r,{fill=C.box,stroke=C.line,sw=2,op=1}={}){ if(op<=0)return; out+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" opacity="${op}"/>`; }

function path(d,{stroke=C.dim,sw=2,op=1,dash='',fill='none'}={}){ if(op<=0)return; out+=`<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"${dash?` stroke-dasharray="${dash}"`:''}/>`; }
function arrow(x1,y1,x2,y2,o={}){ line(x1,y1,x2,y2,o); const a=Math.atan2(y2-y1,x2-x1),L=12; const op=o.op??1; if(op<=0)return;

function cross(x,y,s,col,op){ line(x-s/2,y-s/2,x+s/2,y+s/2,{stroke:col,sw:3,op}); line(x+s/2,y-s/2,x-s/2,y+s/2,{stroke:col,sw:3,op}); }

function wrap(s,n){ const ls=[]; let l=''; for(const w of s.split(' ')){ if((l+' '+w).length>n&&l){ls.push(l);l=w;} else l=l?l+' '+w:w; } ls.push(l); return ls; }

  if(kind==='person'){ circ(x,y-14*k,11*k,{fill:col+'33',stroke:col,op}); path(`M${x-20*k},${y+24*k} Q${x},${y-8*k} ${x+20*k},${y+24*k} Z`,{stroke:col,fill:col+'33',op}); }
  if(kind==='bot'){ rect(x-20*k,y-14*k,40*k,32*k,{fill:col+'22',stroke:col,sw:3,op,r:8*k}); circ(x-8*k,y,4*k,{fill:col,stroke:'none',sw:0,op}); circ(x+8*k,y,4*k,{fill:col,stroke:'none',sw:0,op}); line(x,y-14*k,x,y-24*k,{stroke:col,sw:3,op}); circ(x,y-26*k,4*k,{fill:col,stroke:'none',sw:0,op}); line(x-7*k,y+10*k,x+7*k,y+10*k,{stroke:col,sw:2.5,op}); }
  if(kind==='db'){ out+=`<ellipse cx="${x}" cy="${y-18*k}" rx="${22*k}" ry="${8*k}" fill="${col}22" stroke="${col}" stroke-width="3" opacity="${op}"/>`; path(`M${x-22*k},${y-18*k} L${x-22*k},${y+18*k} A${22*k},${8*k} 0 0 0 ${x+22*k},${y+18*k} L${x+22*k},${y-18*k}`,{stroke:col,sw:3,op,fill:col+'22'}); path(`M${x-22*k},${y} A${22*k},${8*k} 0 0 0 ${x+22*k},${y}`,{stroke:col,sw:2.5,op}); }
  if(kind==='group'){ icon('person',x-12*k,y+2*k,s*.7,col,op); icon('person',x+12*k,y+2*k,s*.7,col,op); }
  if(kind==='review'){ rect(x-28*k,y-22*k,56*k,38*k,{fill:col+'22',stroke:col,sw:3,op,r:4}); line(x,y+16*k,x,y+24*k,{stroke:col,sw:3,op}); line(x-12*k,y+25*k,x+12*k,y+25*k,{stroke:col,sw:3,op}); circ(x-12*k,y-8*k,6*k,{fill:col,stroke:'none',sw:0,op}); path(`M${x-21*k},${y+10*k} Q${x-12*k},${y-4*k} ${x-3*k},${y+10*k} Z`,{stroke:col,fill:col,op,sw:1}); [-10,-2,6].forEach(d=>line(x+4*k,y+d*k,x+20*k,y+d*k,{stroke:col,sw:2.5,op})); }
  if(kind==='doc'){ path(`M${x-20*k},${y-27*k} L${x+10*k},${y-27*k} L${x+21*k},${y-16*k} L${x+21*k},${y+27*k} L${x-20*k},${y+27*k} Z`,{stroke:col,sw:3,op,fill:col+'22'}); [-10,0,10].forEach(d=>line(x-11*k,y+d*k,x+12*k,y+d*k,{stroke:col,op,sw:2.5})); }
  if(kind==='shield'){ path(`M${x},${y-26*k} L${x+22*k},${y-18*k} L${x+22*k},${y} C${x+22*k},${y+14*k} ${x+10*k},${y+22*k} ${x},${y+27*k} C${x-10*k},${y+22*k} ${x-22*k},${y+14*k} ${x-22*k},${y} L${x-22*k},${y-18*k} Z`,{stroke:col,sw:3,op,fill:col+'22'}); }
  if(kind==='layers'){ [12,0,-12].forEach((d,i)=>path(`M${x-24*k},${y+d*k} L${x},${y+(d-10)*k} L${x+24*k},${y+d*k} L${x},${y+(d+10)*k} Z`,{stroke:col,sw:2.5,op,fill:i==2?col+'44':col+'18'})); }
}

const scenes = [
 ['intro', t=>{
   const o=fin(t,.1,.8);
   txt(640,170,'AI AGENT GOVERNANCE',{size:20,anchor:'middle',fill:C.or,weight:700,op:o});
   txt(640,245,'Monitoring AI agents',{size:54,anchor:'middle',weight:700,op:fin(t,.5,.8)});
   txt(640,292,'checking that what agents do still matches what we agreed',{size:25,anchor:'middle',fill:C.dim,op:fin(t,1.0,.8)});
   const steps=[['Policy','doc'],['Data tiers','layers'],['Identities','key'],['Monitoring','review']];
   steps.forEach(([s,ic],i)=>{ const oo=fin(t,cue.intended+i*.5); const x=280+i*240; const mon=i==3; const lit=mon&&t>=cue.checks;
     circ(x,420,52,{fill:lit?C.or+'2a':C.box,stroke:lit?C.or:mon?C.line:C.bl,op:oo*(mon?fin(t,cue.checks):1),sw:lit?4:2});
     icon(ic,x,422,56,lit?C.or:C.bl,oo*(mon?fin(t,cue.checks):1));
     txt(x,505,s,{size:21,anchor:'middle',weight:mon?700:400,op:oo*(mon?fin(t,cue.checks):1),fill:lit?C.or:C.ink});
     if(i<3) arrow(x+60,420,x+178,420,{stroke:C.line,op:i<2?oo:fin(t,cue.checks),sw:3}); });
   const ob=fin(t,cue.intended+.3); txt(520,560,'what we intended',{size:17,anchor:'middle',fill:C.dim,op:ob*(1-fin(t,cue.fabric))}); line(280,535,760,535,{stroke:C.dim,sw:1.5,op:ob*(1-fin(t,cue.fabric)),dash:'4 5'});
   const of=fin(t,cue.fabric); txt(640,565,'Examples use Microsoft Fabric admin APIs',{size:19,anchor:'middle',fill:C.dim,op:of});
 }],

   const lv=[['Tenant admins',150],['Capacity admins',290],['Workspace admins',430]];
   lv.forEach(([s,y],i)=>{ const oo=fin(t,cue.admins+i*.7); rect(70,y,300,96,{fill:C.box,stroke:C.bl,op:oo});
     icon('person',112,y+52,46,C.bl,oo); icon('person',146,y+52,46,C.bl,oo); txt(176,y+56,s,{size:19,weight:700,op:oo});
     const oadd=fin(t,cue.add+i*.3); arrow(375,y+48,455,y+48,{stroke:C.dim,op:oadd,sw:2.5}); });
   txt(415,135,'can add',{size:16,anchor:'middle',fill:C.dim,op:fin(t,cue.add)});
   // identity card
   const oi=fin(t,cue.add+.5);
   rect(470,150,330,376,{fill:C.box,stroke:C.line,op:oi,r:14});
   icon('bot',520,200,52,C.or,oi); txt(560,198,'Agent identity',{size:20,weight:700,op:oi}); txt(560,222,'service principal',{size:15,fill:C.dim,op:oi});
   const grants=[['Read: Sales model','intended',C.gr,cue.add+.8],['Admin: Sales workspace','fix a failing refresh',C.warn,cue.sp],['Group → Finance workspace','group given new access',C.warn,cue.grp]];
   grants.forEach(([a,b,col,c],i)=>{ const oo=fin(t,c); const y=258+i*80; rect(490,y,290,66,{fill:col+'18',stroke:col,op:oo,r:10});
     txt(505,y+28,a,{size:17,weight:700,op:oo}); txt(505,y+52,b,{size:15,fill:C.dim,op:oo}); });
   // access gauge

   const ih=60; line(870,500-ih,1210,500-ih,{stroke:C.gr,sw:2,op:od,dash:'6 5'}); txt(1210,500-ih-8,'intended',{size:14,anchor:'end',fill:C.gr,op:od});
   const lv2=[[cue.drift,ih],[cue.sp,170],[cue.grp,270]]; let h=0;
   const xs=[880,990,1100];
   lv2.forEach(([c,v],i)=>{ const oo=fin(t,c); const hh=v*oo; rect(xs[i],500-hh,90,hh,{fill:(i?C.warn:C.gr)+'55',stroke:i?C.warn:C.gr,op:oo,r:4,sw:1.5}); });

 }],
 ['qs', t=>{

     circ(x,250,64,{fill:col+'1c',stroke:col,op:o,sw:2.5}); icon(ic,x,252,74,col,o);

     const oe=fin(t,cue.ev+i*.6); line(x,430,x,470,{stroke:col,sw:2.5,op:oe}); pill(x-150,472,300,src,col,oe,20,48,'26',C.ink,700); });
   const ok=fin(t,cue.ev+2); txt(640,580,'each question has its own source of evidence',{size:19,anchor:'middle',fill:C.dim,op:ok});
 }],
 ['where', t=>{

function subtitle(t){ const s=SENTS.find(s=>t>=s.start-.05 && t<=s.end+.3); if(!s) return;
  const lines=wrap(s.text.join(' '),98);
  const h=lines.length*30+18; rect(140,714-h-4,1000,h,{fill:'#000000',stroke:'none',sw:0,r:8,op:.7});

window.render = function(t){
  out=`<rect width="1280" height="720" fill="${C.bg}"/>`;
  const keys=scenes.map(s=>T[s[0]]);
  let idx=0; for(let i=0;i<scenes.length;i++) if(t>=keys[i]) idx=i;
  const next = idx+1<scenes.length ? keys[idx+1] : END;
  const fadeOut = clamp((next - t)/0.4);
  out+=`<g opacity="${idx+1<scenes.length?fadeOut:1}">`; scenes[idx][1](t); out+='</g>';
  rect(0,0,1280*clamp(t/END),4,{fill:C.or,stroke:'none',sw:0,r:0});
  subtitle(t);
  S.innerHTML=out;
};
